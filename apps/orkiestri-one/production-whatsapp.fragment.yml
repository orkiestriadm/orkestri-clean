
  api:
    environment:
      MEDIA_WORKER_URL: http://media-worker:8081
      WHATSAPP_DOCS_DIR: /app/secure/whatsapp
    volumes:
      - whatsapp_docs_data:/app/secure/whatsapp

  media-worker:
    image: orkestri/media-worker:one-base-20261025
    container_name: orkestri_media_worker
    restart: unless-stopped
    init: true
    env_file:
      - ./.secrets/whatsapp-media.env
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    mem_limit: 768m
    memswap_limit: 1024m
    cpus: 1
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - orkestri_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  whatsapp_docs_data:
