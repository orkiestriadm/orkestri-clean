events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 20M;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json image/svg+xml font/truetype font/opentype;

  limit_req_zone $binary_remote_addr zone=login_limit:10m  rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=60r/s;
  limit_req_zone $binary_remote_addr zone=export_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=form_limit:10m   rate=6r/m;

  proxy_connect_timeout 10s;
  proxy_send_timeout    30s;
  proxy_read_timeout    60s;
  # 16k: o Set-Cookie do login carrega o JWT com a lista inteira de permissoes
  # do usuario (143 no catalogo). Com 4k o nginx recusa a resposta com "upstream
  # sent too big header" e devolve 502 — a API autentica, o cookie nao chega, e
  # a tela diz "Erro no servidor". Ja aconteceu aqui em 29/07/2026.
  proxy_buffer_size     16k;
  proxy_buffers         8 16k;
  proxy_busy_buffers_size 32k;

  resolver 127.0.0.11 valid=30s ipv6=off;

  # ── HTTP: certbot challenge + redirect para HTTPS ──────────────────────────
  server {
    listen 80;
    server_name orkiestri.com www.orkiestri.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location = /health {
      access_log off;
      return 200 "OK";
      add_header Content-Type text/plain;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ════════════════════════════════════════════════════════════════════════════
  # HTTPS — orkiestri.com + www
  #
  # Mesmo domínio, dois apps Next.js convivendo:
  #   • SITE institucional (orkestri_website) → rotas públicas + "/" (catch-all)
  #   • PLATAFORMA/SISTEMA (orkestri_frontend + orkestri_api) → rotas do sistema
  #
  # Prioridade do nginx: exact "=" > "^~" > regex "~" (na ordem) > prefixo (mais
  # longo). Assets: plataforma dona de /_next/, site namespaced em /_site/.
  # ════════════════════════════════════════════════════════════════════════════
  server {
    listen 443 ssl;
    server_name orkiestri.com www.orkiestri.com;

    ssl_certificate     /etc/letsencrypt/live/orkiestri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orkiestri.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options    "nosniff"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    location = /health {
      access_log off;
      return 200 "OK";
      add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # ── Upstreams ──
    # $site : novo site institucional | $fe : frontend da plataforma | $api : backend
    # (variáveis para forçar re-resolução via resolver do Docker)

    # ─────────────────────────── PLATAFORMA / SISTEMA ───────────────────────────
    # Login rate-limited (mantém a proteção original do sistema).
    location = /api/auth/login {
      limit_req        zone=login_limit burst=5 nodelay;
      limit_req_status 429;
      set $api http://orkestri_api:3000;
      proxy_pass         $api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   Connection        "";
    }

    # Endpoints de formulário do SITE (contato/demo/newsletter) → site.
    location ~ ^/api/(contact|demo|newsletter)$ {
      limit_req        zone=form_limit burst=3 nodelay;
      limit_req_status 429;
      set $site http://orkestri_website:3000;
      proxy_pass         $site;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   Connection        "";
    }

    # Exports do sistema rate-limited.
    location ~* /api/.*/(export|csv|relatorio|download) {
      limit_req        zone=export_limit burst=3 nodelay;
      limit_req_status 429;
      set $api http://orkestri_api:3000;
      proxy_pass         $api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   Connection        "";
    }

    # Demais chamadas de API → backend do sistema.

    # ── WebSocket do Monitoramento ───────────────────────────────────────────
    # Sem este bloco, /socket.io cai no `location /`, que aqui é do SITE
    # institucional — o handshake nunca chega ao gateway e o tempo real do
    # módulo fica desligado sem erro em lugar nenhum.
    # Upgrade/Connection são obrigatórios, e o timeout longo também: conexão de
    # tempo real fica ociosa entre eventos, e o padrão de 60s a derrubaria.
    location /socket.io/ {
      set $ws http://orkestri_api:3000;
      proxy_pass         $ws;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering    off;
    }
    location /api/ {
      limit_req        zone=api_limit burst=200 nodelay;
      set $api http://orkestri_api:3000;
      proxy_pass         $api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   Connection        "";
    }

    # Rotas de página do SISTEMA (um único regex) → frontend da plataforma.
    # Inclui headers de upgrade (websocket/HMR) e re-resolução via variável.
    location ~ ^/(dashboard|login|signup|portal|kb|reservas|primeiro-acesso|recuperar-senha|solicitar-acesso|suspended|entenda-orkiestri)(/|$) {
      set $fe http://orkestri_frontend:3000;
      proxy_pass         $fe;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";

      # O Next serve página pré-renderizada com `s-maxage=31536000`. O HTML
      # guarda o nome dos chunks daquele build, e o nome muda a cada deploy:
      # navegador com HTML antigo pede chunk inexistente e fica em branco, ou
      # segue exibindo a versão anterior. Só o documento — os assets sob
      # /_next/static/ continuam com cache de um ano, onde o nome é o hash.
      proxy_hide_header  Cache-Control;
      add_header Cache-Control "no-store, must-revalidate" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header X-Frame-Options           "SAMEORIGIN"                                  always;
      add_header X-Content-Type-Options    "nosniff"                                     always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin"             always;
    }

    # ── Painel Super Admin ────────────────────────────────────────────────
    # Antes só existia em http://IP:8080, sem TLS e aberto para a internet:
    # login de super admin trafegando em claro. Fica antes do catch-all para
    # o `location /` do site não engolir.
    location = /sa { return 301 https://$host/sa/; }

    location /sa/ {
      set $sa http://orkestri_sa_panel:3001;
      # proxy_pass com variável não substitui o prefixo sozinho.
      rewrite ^/sa/(.*)$ /$1 break;
      proxy_pass         $sa;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   Connection        "";

      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
      add_header X-Frame-Options           "DENY"                                         always;
      add_header X-Content-Type-Options    "nosniff"                                      always;
      add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
      add_header Cache-Control             "no-store"                                     always;
      add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
    }

    # Assets do sistema (Next.js do frontend).
    location /_next/ {
      set $fe http://orkestri_frontend:3000;
      proxy_pass         $fe;
      proxy_http_version 1.1;
      proxy_set_header   Host       $host;
      proxy_set_header   Connection "";
    }

    # Estáticos do frontend que vivem na raiz de `frontend/public`.
    #
    # Sem esta regra eles caem no catch-all e o SITE responde HTML 404 no lugar
    # do arquivo — foi o que aconteceu com /branding/planeta.jpg, o plano de
    # fundo do login, que ficou quebrado desde o cutover do site.
    # Regex tem prioridade sobre o prefixo "/", então basta existir.
    location ~ ^/(branding|videos)/ {
      set $fe http://orkestri_frontend:3000;
      proxy_pass         $fe;
      proxy_http_version 1.1;
      proxy_set_header   Host       $host;
      proxy_set_header   Connection "";
      add_header         Cache-Control "public, max-age=604800";
    }

    location ~ ^/(sw\.js|logo-orkiestri-dark\.png)$ {
      set $fe http://orkestri_frontend:3000;
      proxy_pass         $fe;
      proxy_http_version 1.1;
      proxy_set_header   Host       $host;
      proxy_set_header   Connection "";
    }

    # ─────────────────────────── SITE INSTITUCIONAL ───────────────────────────
    # Assets namespaced do site (assetPrefix=/_site). Servidos pelo próprio site.
    location /_site/ {
      set $site http://orkestri_website:3000;
      proxy_pass         $site;
      proxy_http_version 1.1;
      proxy_set_header   Host       $host;
      proxy_set_header   Connection "";
      add_header         Cache-Control "public, max-age=31536000, immutable";
    }

    # Catch-all: "/" e todas as rotas públicas (products, services, company…) → SITE.
    location / {
      set $site http://orkestri_website:3000;
      proxy_pass         $site;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
    }
  }
}
