# Website service overlay.
# Deploy on the server with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f website/deploy/docker-compose.website.yml up -d --build website
#
# The website is a Next.js standalone container (mostly static + 2 form API
# routes). Conservative memory footprint for the Lightsail 2GB host.
services:
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    image: orkestri/website:latest
    container_name: orkestri_website
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      # Cache do otimizador de imagem do Next.
      #
      # Sem isto o container NÃO consegue criar `/app/.next/cache` (o sistema
      # de arquivos é read_only) e cada pedido a `/_next/image` termina em
      # `ENOENT: mkdir` + unhandledRejection — a resposta nunca fecha e a
      # imagem fica carregando para sempre. Em 26/10/2026 isso deixou oito das
      # nove capturas do hero em branco em produção; só a primeira aparecia,
      # porque eu a tinha aquecido com um curl.
      #
      # `mode=1777` é obrigatório: tmpfs nasce de root e o processo roda como
      # `app` (ver Dockerfile) — sem isso o diretório existe e continua sem
      # permissão de escrita, que é o mesmo erro com outra mensagem.
      # Ver [[feedback-volume-nasce-root-dockerfile]], mesma armadilha.
      - /app/.next/cache:mode=1777,size=64m
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=192"
      NEXT_PUBLIC_SITE_URL: "https://www.orkiestri.com"
    mem_limit: 256m
    memswap_limit: 256m
    networks:
      - orkestri_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
